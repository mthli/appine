[package]
name = "appine-share"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace]

[dependencies]
base64 = "0.22"
fuser = { version = "=0.18.0", default-features = false }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = { version = "0.12", default-features = false }
ureq = { version = "3", default-features = false, features = ["json"] }
form_urlencoded = "1"
percent-encoding = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
